<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#101010">

  <title>Bas Kar Bhai</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      min-height: 100vh;

      display: grid;

      place-items: center;

      padding: 24px;

      background: #101010;

      color: #fff;

      font-family: -apple-system, BlinkMacSystemFont, sans-serif;

      text-align: center;

    }

    main {

      width: 100%;

      max-width: 360px;

    }

    .eyebrow {

      color: #888;

      font-size: 12px;

      letter-spacing: 4px;

      text-transform: uppercase;

    }

    h1 {

      font-size: 36px;

      line-height: 1.2;

      margin: 22px 0 8px;

      letter-spacing: -1.5px;

    }

    .subtitle {

      color: #999;

      font-size: 15px;

    }

    .count {

      font-size: 104px;

      line-height: 1.2;

      font-weight: 800;

      letter-spacing: -6px;

      margin-top: 36px;

      font-variant-numeric: tabular-nums;

    }

    .label {

      color: #888;

      font-size: 12px;

      letter-spacing: 3px;

      text-transform: uppercase;

    }

    .status {

      margin: 26px 0;

      font-size: 13px;

      color: #999;

    }

    button {

      width: 100%;

      border: 1px solid #383838;

      border-radius: 16px;

      background: #fff;

      color: #111;

      padding: 19px 14px;

      font-size: 17px;

      font-weight: 750;

      cursor: pointer;

    }

    button:disabled {

      opacity: .5;

      cursor: not-allowed;

    }

    .footer {

      margin-top: 28px;

      color: #666;

      font-size: 12px;

    }

  </style>

</head>

<body>

  <main>

    <div class="eyebrow">A friendly reminder</div>

    <h1>Kya kar raha hai bhai?<br>Bas kar!!</h1>

    <div class="subtitle">

      Teri bandi dekh rahi hai. 👀

    </div>

    <div class="count" id="count">—</div>

    <div class="label">TOTAL COUNT</div>

    <div class="status" id="status">

      Connecting...

    </div>

    <button id="add" disabled>

      Theek hai baba 😭

    </button>

    <div class="footer">

      Made with love. Thodi si daant ke saath.

    </div>

  </main>

  <script type="module">

    import { createClient } from

      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =

      "https://nbfcprsywnisnssruazt.supabase.co";

    // Replace with your Supabase publishable key.

    // Never put a service_role key or private secret here.

    const SUPABASE_KEY =

      "sb_publishable_jSEIIbB5iFaIPqCrkVP2bA_ew5kcyjI";

    const countEl = document.getElementById("count");

    const statusEl = document.getElementById("status");

    const addBtn = document.getElementById("add");

    if (SUPABASE_KEY.includes("PASTE_YOUR")) {

      statusEl.textContent = "Setup pending";

    } else {

      const supabase = createClient(

        SUPABASE_URL,

        SUPABASE_KEY

      );

      async function refreshCount() {

        const { data, error } = await supabase

          .from("cigarette_counter")

          .select("total")

          .eq("id", 1)

          .single();

        if (error) {

          statusEl.textContent = "Connection issue";

          console.error(error);

          return;

        }

        countEl.textContent = data.total;

        statusEl.textContent = "Haan bhai, sab dekh rahe hain.";

        addBtn.disabled = false;

      }

      await refreshCount();

      supabase

        .channel("shared-counter")

        .on(

          "postgres_changes",

          {

            event: "UPDATE",

            schema: "public",

            table: "cigarette_counter",

            filter: "id=eq.1"

          },

          (payload) => {

            countEl.textContent = payload.new.total;

          }

        )

        .subscribe();

      // The increment action will be connected

      // through the secure iPhone Shortcut.

      addBtn.addEventListener("click", () => {

        statusEl.textContent =

          "Bhai, +1 shortcut abhi set karna hai 😭";

      });

    }

  </script>

</body>

</html>
